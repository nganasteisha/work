<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Графік роботи</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">
        <div>
            <div class="label">РОБОЧИЙ ГРАФІК</div>
            <h1>Графік роботи</h1>
            <p>Натисни на день, щоб додати зміну</p>
        </div>

        <button class="employees-button" id="employeesButton">
            👥 Працівники
        </button>
    </header>


    <main class="calendar-container">

        <div class="calendar-navigation">

            <button class="arrow-button" id="prevMonth">
                ‹
            </button>

            <div class="month-center">
                <h2 id="monthTitle"></h2>

                <button class="today-button" id="todayButton">
                    Сьогодні
                </button>
            </div>

            <button class="arrow-button" id="nextMonth">
                ›
            </button>

        </div>


        <div class="weekdays">
            <div>Пн</div>
            <div>Вт</div>
            <div>Ср</div>
            <div>Чт</div>
            <div>Пт</div>
            <div class="weekend">Сб</div>
            <div class="weekend">Нд</div>
        </div>


        <div class="calendar" id="calendar"></div>

    </main>

</div>


<!-- =========================
     МОДАЛЬНЕ ВІКНО ЗМІНИ
========================= -->

<div class="modal-overlay" id="shiftModal">

    <div class="modal">

        <div class="modal-header">

            <div>
                <div class="modal-small-title">
                    ГРАФІК
                </div>

                <h3 id="modalTitle">
                    Додати зміну
                </h3>

                <p id="modalDate"></p>
            </div>

            <button class="close-button" id="closeShiftModal">
                ×
            </button>

        </div>


        <div class="modal-body">

            <div class="input-row">

                <label>
                    Магазин
                </label>

                <select id="storeSelect">
                </select>

            </div>


            <div class="input-row">

                <label>
                    Працівник
                </label>

                <select id="employeeSelect">
                </select>

                <!-- Показується, якщо працівника вже видалили зі списку -->
                <div
                    class="deleted-employee-warning"
                    id="deletedEmployeeWarning"
                    style="display:none;"
                >
                    ⚠️ Цього працівника вже немає у списку працівників.
                    Стару зміну все одно можна видалити.
                </div>

            </div>


            <div class="modal-buttons">

                <button
                    class="delete-button"
                    id="deleteShift"
                >
                    🗑 Видалити зміну
                </button>

                <button
                    class="save-button"
                    id="saveShift"
                >
                    ✓ Зберегти
                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     ПРАЦІВНИКИ
========================= -->

<div class="modal-overlay" id="employeesModal">

    <div class="modal employees-modal">

        <div class="modal-header">

            <div>
                <div class="modal-small-title">
                    КОМАНДА
                </div>

                <h3>Працівники</h3>
            </div>

            <button class="close-button" id="closeEmployeesModal">
                ×
            </button>

        </div>


        <div class="modal-body">

            <div class="add-employee">

                <input
                    type="text"
                    id="employeeInput"
                    placeholder="Ім'я працівника"
                >

                <button id="addEmployee">
                    Додати
                </button>

            </div>


            <div
                class="employees-list"
                id="employeesList"
            ></div>

        </div>

    </div>

</div>


<!-- ПІДТВЕРДЖЕННЯ ВИДАЛЕННЯ ПРАЦІВНИКА -->
<div class="confirm-overlay" id="deleteEmployeeModal">

    <div class="confirm-modal">

        <button class="confirm-close" id="cancelDeleteEmployee">
            ×
        </button>

        <div class="confirm-icon">
            🗑
        </div>

        <h3>Видалити працівника?</h3>

        <p id="deleteEmployeeText">
            Видалити працівника зі списку?
        </p>

        <div class="confirm-buttons">

            <button
                class="confirm-cancel"
                id="cancelDeleteEmployeeButton"
            >
                Скасувати
            </button>

            <button
                class="confirm-delete"
                id="confirmDeleteEmployee"
            >
                Видалити
            </button>

        </div>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>

<script src="script.js"></script>
</body>
</html>
